# Serena context "lsp-only": exposes only Serena's language-server-backed symbol
# tools (navigation, diagnostics, symbol-aware edits) plus replace_in_files, for a
# host agent whose own built-in tools already cover file reading, text search,
# line edits, shell commands, and memory.
#
# Contexts are documented at
# https://oraios.github.io/serena/02-usage/050_configuration.html#contexts and
# the tool names at https://oraios.github.io/serena/01-about/035_tools.html.
#
# Serena reads a context once, when its MCP server starts; restarting the
# language servers does not reload it, so a changed context takes effect only
# after the Serena MCP server restarts. Tool exclusions apply only under Serena's
# "tools" agent interface; under the REPL interface they are ignored and Serena
# exposes its REPL tool in place of the symbol tools. The --agent-interface tools
# option overrides the interface set in the global Serena configuration, but a
# project's own .serena/project.yml agent_interface setting takes precedence over
# both, so a project that selects REPL there does not get this context's tools.
description: Language-server symbol tools only, for a host agent that handles files, text search, shell, and memory with its own tools
# The context prompt reaches the agent only through Serena's system prompt, which
# is delivered by the initial_instructions tool that this context excludes, so
# the context contributes no prompt text. An empty string rather than null:
# Serena renders this value as a template, and rendering null fails.
prompt: ""
excluded_tools:
  - activate_project
  - create_text_file
  - delete_lines
  - delete_memory
  - edit_memory
  - execute_shell_command
  # - find_declaration  # LSP tool
  - find_file
  # - find_implementations  # LSP tool
  # - find_referencing_symbols  # LSP tool
  # - find_symbol  # LSP tool
  # - get_diagnostics_for_file  # LSP tool
  - get_current_config
  - open_dashboard
  # - get_symbols_overview  # LSP tool
  - initial_instructions
  # - insert_after_symbol  # LSP tool
  - insert_at_line
  # - insert_before_symbol  # LSP tool
  - jet_brains_find_referencing_symbols
  - jet_brains_find_symbol
  - jet_brains_get_symbols_overview
  - jet_brains_find_declaration
  - jet_brains_find_implementations
  - jet_brains_inline_symbol
  - jet_brains_move
  - jet_brains_rename
  - jet_brains_safe_delete
  - jet_brains_type_hierarchy
  - jet_brains_debug
  - jet_brains_run_inspections
  - jet_brains_list_inspections
  - list_dir
  - list_memories
  - onboarding
  - read_file
  - read_memory
  - rename_memory
  - remove_project
  # - rename_symbol  # LSP tool
  - replace_content
  # - replace_in_files  # deliberately included (not LSP): atomic multi-file text replace with dry-run preview
  - replace_lines
  # - replace_symbol_body  # LSP tool
  # - restart_language_server  # LSP tool
  # - safe_delete_symbol  # LSP tool
  - search_for_pattern
  - serena_info
  - serena_repl
  - write_memory
  - list_queryable_projects
  - query_project

# several tools are excluded by default and have to be explicitly included by the user
included_optional_tools:
  - restart_language_server
  - get_diagnostics_for_symbol

# Each entry replaces the description Serena gives a tool, which is otherwise the
# docstring of the tool's apply method. Serena's own restart_language_server
# description allows a restart only on the user's explicit request or after
# confirmation. A restart changes no source or configuration file, so the
# override lets the agent restart the language servers itself, and tells it what
# a restart cannot fix.
tool_description_overrides:
  restart_language_server: >-
    Restarts the project's language servers. Call it without asking the user
    whenever a language server hangs, stops responding, or returns results that
    are stale after files changed outside Serena. It rebuilds the servers from
    the project configuration Serena loaded when it started and does not re-read
    .serena/project.yml, so it cannot help when that configuration lists no
    language servers; an edited project.yml takes effect only after the Serena
    MCP server itself restarts.

# whether to assume that Serena shall only work on a single project in this context (provided that a project is given
# when Serena is started).
# If set to true and a project is provided at startup, the set of tools is limited to those required by the project's
# concrete configuration, and other tools are excluded completely, allowing the set of tools to be minimal.
# The `activate_project` tool will, therefore, be disabled in this case, as project switching is not allowed.
single_project: true

# Claude Code does not unpack structured MCP tool output: with structured output
# on (Serena's automatic default), every result arrives as an escaped JSON string
# wrapped in {"result": ...}, which costs tokens and hides the result's layout.
# Off, each tool returns its plain text result.
structured_tool_output: false
